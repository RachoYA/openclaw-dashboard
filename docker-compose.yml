services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openclaw-dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-3100}:80"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:18789}
      VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:18789}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  # BFF service — polls OpenClaw, serves agent state via WebSocket
  bff:
    build:
      context: ./bff
    container_name: openclaw-dashboard-bff
    restart: unless-stopped
    ports:
      - "${BFF_PORT:-3101}:3101"
    environment:
      PORT: 3101
      POLL_INTERVAL: ${POLL_INTERVAL:-10000}
      OPENCLAW_BIN: ${OPENCLAW_BIN:-openclaw}
