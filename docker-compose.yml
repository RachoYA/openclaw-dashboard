services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openclaw-dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-3100}:80"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:18789}
      VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:18789}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  # Redis — pub/sub + caching for real-time agent state
  redis:
    image: redis:7-alpine
    container_name: openclaw-dashboard-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6390}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru

  # BFF service — reads OpenClaw data files, publishes to Redis, serves WebSocket
  bff:
    build:
      context: ./bff
    container_name: openclaw-dashboard-bff
    restart: unless-stopped
    ports:
      - "${BFF_PORT:-3101}:3101"
    environment:
      PORT: 3101
      POLL_INTERVAL: ${POLL_INTERVAL:-10000}
      # Path inside container where OpenClaw agents dir is mounted
      OPENCLAW_DATA_DIR: /openclaw-data/agents
      REDIS_URL: redis://redis:6379
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPOS: ${GITHUB_REPOS:-RachoYA/ventMaind,RachoYA/openclaw-dashboard}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:--5102635917}
    volumes:
      # Mount host OpenClaw agents dir read-only.
      # Works with snap Docker since /home is an allowed bind-mount path.
      - /home/racho/.openclaw/agents:/openclaw-data/agents:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3101/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  redis-data:
